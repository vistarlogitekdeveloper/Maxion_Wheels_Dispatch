name: maxion_wheels_dispatch
description: "Maxion Wheels Dispatch Operations Digitalization Flutter App by Vistar Logitek"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  # Pure-Dart QR encoding, so print templates generate symbols offline
  # instead of fetching them from a public web API.
  qr: ^3.0.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  excel: ^4.0.6
  archive: ^3.6.1

  # Offline-first stack (SSR Section 11). Same choice as qr_dispatch_app, which
  # solves the same problem on the same floor: a local SQLite outbox the gun
  # writes to first, so a scan is recorded and acknowledged in under a second
  # whether or not the network is there.
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  # Tells the sync loop when to try again, instead of polling into a dead
  # network from a warehouse aisle.
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Generates app_database.g.dart from the table definitions.
  drift_dev: ^2.34.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    # Only the autocropped derivatives ship. assets/logo.png and
    # assets/logo_name.png stay in the repo as the source art the derivatives
    # are generated from - bundling them too would add 4.2 MB the app never
    # loads. Regenerate with tool/build_brand_assets.js after changing either.
    - assets/brand/
