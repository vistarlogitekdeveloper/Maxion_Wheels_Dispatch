# 4 GB, up from 2 GB. AGP 8.11 with R8 and the drift/sqlite native libraries
# exhausts a 2 GB heap during dexing, which surfaces as a build that fails with
# "Gradle build ran out of Java heap space" rather than as a code error.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Jetifier rewrites legacy support-library references at build time. Nothing in
# this dependency set needs it any more, and leaving it on costs a full pass
# over every artifact on each build.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
